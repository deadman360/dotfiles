# Configuração do Alacritty convertida do Ghostty

[window]
opacity = 0.78
decorations = "None"
startup_mode = "Maximized"
class = { instance = "Alacritty", general = "Alacritty" }

[window.padding]
x = 0
y = 0

[font]
size = 16.0

[font.normal]
family = "ZedMonoNerdFont"
style = "Regular"

[font.bold]
family = "ZedMonoNerdFont"
style = "Bold"

[font.italic]
family = "ZedMonoNerdFont"
style = "Italic"

[font.bold_italic]
family = "ZedMonoNerdFont"
style = "Bold Italic"

[cursor]
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "Off"

[scrolling]
history = 10000

[terminal.shell]
program = "/bin/bash"

[colors.primary]
background = "#0e1019"
foreground = "#fffaf4"

[colors.normal]
black = "#232323"
red = "#ff000f"
green = "#8ce10b"
yellow = "#ffb900"
blue = "#008df8"
magenta = "#6d43a6"
cyan = "#00d8eb"
white = "#ffffff"

[colors.bright]
black = "#444444"
red = "#ff2740"
green = "#abe15b"
yellow = "#ffd242"
blue = "#0092ff"
magenta = "#9a5feb"
cyan = "#67fff0"
white = "#ffffff"

[env]
TERM = "alacritty"
