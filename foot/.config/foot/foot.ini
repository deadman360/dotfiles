# DRACULA THEME FOR FOOT TERMINAL

[main]
# Mantendo a fonte padrão do seu sistema [cite: 1]
font=MonoidNerdFontMono-Regular:size=14
pad=15x15
initial-window-mode=maximized

[colors-dark]
# Transparência mantida em 0.80 como solicitado
alpha=0.80

# Fundo praticamente preto (Ultra Dark)
background=050505
# Texto claro do Dracula
foreground=f8f8f2

## Paleta ANSI Dracula (Cores vibrantes para contraste)
regular0=21222c       # Black
regular1=ff5555       # Red
regular2=50fa7b       # Green
regular3=f1fa8c       # Yellow
regular4=bd93f9       # Blue
regular5=ff79c6       # Magenta
regular6=8be9fd       # Cyan
regular7=f8f8f2       # White

bright0=6272a4        # Bright Black (Comment)
bright1=ff6e6e        # Bright Red
bright2=69ff94        # Bright Green
bright3=ffffa5        # Bright Yellow
bright4=d6acff        # Bright Blue
bright5=ff92df        # Bright Magenta
bright6=a4ffff        # Bright Cyan
bright7=ffffff        # Bright White

## Seleção e Cursor
selection-foreground=ffffff
selection-background=44475a
urls=8be9fd
cursor=050505 ff79c6

[cursor]
style=beam
blink=yes

[csd]
preferred=none
