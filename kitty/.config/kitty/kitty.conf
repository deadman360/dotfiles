# GRUVBOX DARK HARD THEME FOR KITTY TERMINAL

# ═══════════════════════════════════════════
# FONTES
# ═══════════════════════════════════════════
font_family      MonoidNerdFontMono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0

# ═══════════════════════════════════════════
# ESQUEMA DE CORES — GRUVBOX DARK HARD (ULTRA DARK)
# ═══════════════════════════════════════════
background           #080808
foreground           #ebdbb2
selection_foreground  #ebdbb2
selection_background  #504945
cursor               #ebdbb2
cursor_text_color    #080808
url_color            #83a598

# Cores ANSI (normais)
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984

# Cores ANSI (brilhantes)
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2

# ═══════════════════════════════════════════
# CURSOR
# ═══════════════════════════════════════════
cursor_shape          beam
cursor_blink_interval 0.5

# ═══════════════════════════════════════════
# JANELA
# ═══════════════════════════════════════════
window_padding_width     15
hide_window_decorations  yes
confirm_os_window_close  0
remember_window_size     no
initial_window_width     1920
initial_window_height    1080

# ═══════════════════════════════════════════
# ROLAGEM
# ═══════════════════════════════════════════
scrollback_lines 10000

# ═══════════════════════════════════════════
# FUNDO
# ═══════════════════════════════════════════
background_opacity 1.0

# ═══════════════════════════════════════════
# SINO
# ═══════════════════════════════════════════
enable_audio_bell no

# ═══════════════════════════════════════════
# URL
# ═══════════════════════════════════════════
detect_urls yes
url_style   curly

# ═══════════════════════════════════════════
# BARRA DE ABAS
# ═══════════════════════════════════════════
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_edge         bottom
tab_bar_min_tabs     2
tab_title_template   "{index}: {title}"
active_tab_foreground   #1d2021
active_tab_background   #ebdbb2
active_tab_font_style   bold
inactive_tab_foreground #1d2021
inactive_tab_background #a89984
inactive_tab_font_style normal
tab_bar_background      #282828

# ═══════════════════════════════════════════
# INTEGRAÇÃO COM O SHELL
# ═══════════════════════════════════════════
shell_integration enabled

# ═══════════════════════════════════════════
# DIVERSOS
# ═══════════════════════════════════════════
term xterm-kitty
